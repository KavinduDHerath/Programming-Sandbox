name: CI Code Gatekeeper & Auto-Fixer

on:
  push:
    branches: [ "main", "master" ]

# Giving the permission to the robot to write code and create Pull Requests
permissions:
  contents: write
  pull-requests: write

jobs:
  auto-fix-and-review:
    name: Auto-Fix Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python Environment
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # Install 'black' (Python auto-formatter)
      - name: Install Auto-Fixer
        run: pip install black

      # Automatically fix formatting and syntax issues
      - name: Run Auto-Fixer
        run: black . 

      # If the robot changed anything, bundles the changes into a Pull Request to approve
      - name: Create Pull Request with Fixes
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "style: automated code fixes"
          title: "🔧 CI Gatekeeper: Code Fixes Suggested"
          body: "The CI Gatekeeper found some issues and automatically fixed them. Please review the changes and click Merge to approve!"
          branch: "automated-fixes"
