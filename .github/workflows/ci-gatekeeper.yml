name: CI Code Gatekeeper

# run every time when I push to the repository
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  syntax-and-lint-check:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
      # 1. Download code into the virtual server
      - name: Checkout Code
        uses: actions/checkout@v3

      # 2. Setup PHP and scan the /PHP Programs folder
      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          
      - name: Scan PHP Syntax
        # Finds every .php file and checks it for syntax errors
        run: find . -type f -name '*.php' -exec php -l {} \;

      # 3. Setup Python and scan the /Python Programs folder
      - name: Setup Python Environment
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install Python Linter (Flake8)
        run: pip install flake8
        
      - name: Scan Python Syntax
        # Checks for critical Python bugs like undefined variables or syntax errors
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
